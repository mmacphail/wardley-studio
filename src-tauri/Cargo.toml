[package]
name = "wardley-studio"
version = "0.1.0"
description = "A local-first Wardley mapping studio"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[features]
default = ["chat"]
chat = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["parsing"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
