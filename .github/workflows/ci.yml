name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:core
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  linux:
    name: Linux native tests and installers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf fonts-dejavu-core xvfb xauth dbus-x11
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build Linux installers
        run: npm run desktop:build -- --bundles deb,rpm -- --locked
      - name: Test native HTTP API and disk persistence
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: dbus-run-session -- xvfb-run -a python3 scripts/test-native-api.py
      - name: Test runtime-disabled chat
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: dbus-run-session -- xvfb-run -a python3 scripts/test-native-api.py --chat-disabled
      - name: Build without chat
        run: npm run desktop:build:core -- --debug --no-bundle
      - name: Test compiled-out chat
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: dbus-run-session -- xvfb-run -a python3 scripts/test-native-api.py src-tauri/target/debug/wardley-studio --core
      - name: Upload Linux installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wardley-studio-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
